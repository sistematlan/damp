# =============================================================
# DAMP Template: PHP Ancient (PHP 5.6)
# =============================================================
# For extreme legacy rescue projects.
# Uses Apache with mod_rewrite (.htaccess support).
# Also available: php:5.6-fpm (if you prefer nginx)
# =============================================================

services:
  app:
    build: .
    container_name: PROJECT_NAME-app
    volumes:
      - ./:/var/www/html
    environment:
      - MYSQL_HOST=damp-db
      - MYSQL_DATABASE=PROJECT_NAME_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
    restart: unless-stopped
    networks:
      - damp

networks:
  damp:
    external: true
