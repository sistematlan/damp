<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAMP</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/favicon.png" type="image/png">
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <div class="sidebar-brand">
        <img src="/favicon.png" alt="DAMP" style="width:28px;height:28px;margin-right:10px;border-radius:6px;">
        DAMP
      </div>
      <a href="#/" class="nav-item active" data-view="overview">
        <span class="nav-icon">◉</span> Overview
      </a>
      <a href="#/projects" class="nav-item" data-view="projects">
        <span class="nav-icon">⚙</span> Projects
      </a>
      <a href="#/databases" class="nav-item" data-view="databases">
        <span class="nav-icon">☰</span> Databases
      </a>
      <a href="#/logs" class="nav-item" data-view="logs">
        <span class="nav-icon">☷</span> Logs
      </a>
      <div class="sidebar-footer">
        <div class="sidebar-links">
          <a href="https://pma.test" target="_blank" class="sidebar-link">PHPMyAdmin</a>
          <a href="https://mail.test" target="_blank" class="sidebar-link">Mailpit</a>
        </div>
        <div class="lang-toggle">
          <button class="lang-btn active" data-lang="en" onclick="setLang('en')">EN</button>
          <button class="lang-btn" data-lang="es" onclick="setLang('es')">ES</button>
        </div>
        <div class="sidebar-version">DAMP v0.5.0</div>
      </div>
    </nav>

    <main>
      <div class="topbar">
        <div class="topbar-title" id="page-title">Overview</div>
        <div class="topbar-status" id="status-indicator">
          <span class="dot running"></span>
          <span id="container-count">0 containers</span>
        </div>
      </div>
      <div class="content" id="view"></div>
    </main>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/views/overview.js"></script>
  <script src="/js/views/projects.js"></script>
  <script src="/js/views/databases.js"></script>
  <script src="/js/views/logs.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
