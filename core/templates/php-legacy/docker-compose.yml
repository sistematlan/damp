# =============================================================
# DAMP Template: PHP Legacy (PHP 7.4)
# =============================================================
# For legacy projects: CodeIgniter 3, Laravel 8, older WordPress
# Also available: php:7.3-fpm, php:7.2-fpm, php:7.1-fpm
# =============================================================

services:
  app:
    build: .
    container_name: PROJECT_NAME-app
    volumes:
      - ./:/app
    environment:
      - CI_ENVIRONMENT=development
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.5
    pids_limit: 256
    networks:
      - damp

  web:
    image: nginx:alpine
    container_name: PROJECT_NAME-web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/app:ro
    depends_on:
      - app
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 128
    networks:
      - damp

networks:
  damp:
    external: true
