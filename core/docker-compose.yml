services:
  # ── Reverse Proxy ─────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: damp-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/projects.d:/etc/caddy/projects.d:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    env_file:
      - .env
    networks:
      - damp
    restart: unless-stopped
    mem_limit: ${CADDY_MEMORY_LIMIT:-96m}
    memswap_limit: ${CADDY_MEMORY_LIMIT:-96m}
    cpus: ${CADDY_CPU_LIMIT:-0.50}
    pids_limit: 128

  # ── MySQL ────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: damp-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Mexico_City}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
      - ./mysql/low-memory.cnf:/etc/mysql/conf.d/low-memory.cnf:ro
    networks:
      - damp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: ${MYSQL_MEMORY_LIMIT:-384m}
    memswap_limit: ${MYSQL_MEMORY_LIMIT:-384m}
    cpus: ${MYSQL_CPU_LIMIT:-1.50}
    pids_limit: 256

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: damp-postgres
    restart: unless-stopped
    profiles: [postgres, full]
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - damp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    memswap_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    cpus: ${POSTGRES_CPU_LIMIT:-1.00}
    pids_limit: 256

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: damp-redis
    restart: unless-stopped
    profiles: [cache, full]
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-64mb} --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - damp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: ${REDIS_MEMORY_LIMIT:-96m}
    memswap_limit: ${REDIS_MEMORY_LIMIT:-96m}
    cpus: ${REDIS_CPU_LIMIT:-0.50}
    pids_limit: 128

  # ── PHPMyAdmin ──────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: damp-phpmyadmin
    restart: unless-stopped
    profiles: [tools, full]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 512M
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - damp
    depends_on:
      db:
        condition: service_healthy
    mem_limit: ${PMA_MEMORY_LIMIT:-192m}
    memswap_limit: ${PMA_MEMORY_LIMIT:-192m}
    cpus: ${PMA_CPU_LIMIT:-1.00}
    pids_limit: 128

  # ── Mailpit (SMTP de desarrollo) ─────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: damp-mailpit
    restart: unless-stopped
    profiles: [mail, full]
    ports:
      - "${MAIL_HTTP_PORT:-8025}:8025"
      - "${MAIL_SMTP_PORT:-1025}:1025"
    environment:
      TZ: ${TZ:-America/Mexico_City}
    networks:
      - damp
    mem_limit: ${MAILPIT_MEMORY_LIMIT:-96m}
    memswap_limit: ${MAILPIT_MEMORY_LIMIT:-96m}
    cpus: ${MAILPIT_CPU_LIMIT:-0.50}
    pids_limit: 128

  # ── Dashboard ────────────────────────────────────────────────
  dashboard:
    build: ./dashboard
    container_name: damp-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-9200}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/damp:ro
      - ./caddy/projects.d:/damp/caddy/projects.d
      - /etc/hosts:/etc/hosts
      - ${HOME}:${HOME}
    environment:
      DAMP_DIR: /damp
      DAMP_TLD: ${DAMP_TLD:-test}
      HOST_HOME: ${HOME}
      DB_HOST: damp-db
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    networks:
      - damp
    depends_on:
      db:
        condition: service_healthy
    mem_limit: ${DASHBOARD_MEMORY_LIMIT:-128m}
    memswap_limit: ${DASHBOARD_MEMORY_LIMIT:-128m}
    cpus: ${DASHBOARD_CPU_LIMIT:-1.00}
    pids_limit: 128

networks:
  damp:
    name: damp
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  mysql_data:
  postgres_data:
