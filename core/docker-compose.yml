services:
  # ── Reverse Proxy ─────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: damp-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/projects.d:/etc/caddy/projects.d:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    env_file:
      - .env
    networks:
      - damp
    restart: unless-stopped

  # ── DNS Resolver (Auto-DNS *.local) ──────────────────────────
  dns:
    image: andyshinn/dnsmasq:latest
    container_name: damp-dns
    cap_add:
      - NET_ADMIN
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    command: -A /local/127.0.0.1 --log-facility=-
    restart: unless-stopped
    networks:
      - damp

  # ── MySQL ────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: damp-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Mexico_City}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    networks:
      - damp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: damp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - damp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: damp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - damp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PHPMyAdmin ──────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: damp-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 512M
    ports:
      - "${PMA_PORT:-8080}:80"
    networks:
      - damp
    depends_on:
      db:
        condition: service_healthy

  # ── Mailpit (SMTP de desarrollo) ─────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: damp-mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_HTTP_PORT:-8025}:8025"
      - "${MAIL_SMTP_PORT:-1025}:1025"
    environment:
      TZ: ${TZ:-America/Mexico_City}
    networks:
      - damp

  # ── Dashboard ────────────────────────────────────────────────
  dashboard:
    build: ./dashboard
    container_name: damp-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-9200}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/damp:ro
      - ./caddy/projects.d:/damp/caddy/projects.d
      - ${HOME}:${HOME}
    environment:
      DAMP_DIR: /damp
      HOST_HOME: ${HOME}
      DB_HOST: damp-db
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    networks:
      - damp
    depends_on:
      db:
        condition: service_healthy

networks:
  damp:
    name: damp
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  mysql_data:
  postgres_data:
